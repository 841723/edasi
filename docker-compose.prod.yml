services:
  # Servicio de datos: propietario del volumen SQLite (persistente).
  database:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data && sleep infinity"]
    volumes:
      - ./data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      - database
    volumes:
      # Base de datos SQLite (compartida con el servicio database; persiste en el host)
      - ./data:/app/data
      # Garmin OAuth tokens (persisten fuera del repo)
      - garmin_tokens:/root/.garminconnect
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Sirve el frontend compilado y proxya /api al backend (mismo origen).
  frontend:
    build:
      context: .
      dockerfile: docker/frontend-prod.Dockerfile
    ports:
      - "13799:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  garmin_tokens:
