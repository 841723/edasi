services:
  # Servicio de datos: propietario del directorio SQLite (persiste en el host).
  database:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data && sleep infinity"]
    volumes:
      - ./data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - database
    volumes:
      # Hot reload: mount source code into container
      - ./backend:/app/backend
      # Keep dependencies installed by the image out of the bind mount.
      - /app/backend/node_modules
      - ./scripts:/app/scripts
      - ./sessions:/app/sessions
      # Base de datos SQLite (compartida con el servicio database y el host)
      - ./data:/app/data
      # Garmin OAuth tokens (persisten fuera del repo)
      - garmin_tokens:/root/.garminconnect
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    # npm ci al arrancar: garantiza que node_modules (volumen anónimo) coincida
    # siempre con package.json/package-lock, p. ej. al añadir una dependencia
    # nueva como web-push sin necesidad de reconstruir la imagen.
    command: ["sh", "-c", "npm ci --prefix backend && node --watch backend/server.js --port 4000"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend-dev.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Hot reload: mount source code into container
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/public:/app/frontend/public
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/tailwind.config.ts:/app/frontend/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js
    environment:
      # Vite proxya /api al backend dentro de la red de compose.
      - VITE_PROXY_TARGET=http://backend:4000

volumes:
  garmin_tokens:
