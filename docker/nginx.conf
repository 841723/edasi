server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # API y auth van al backend.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    # La generación/chat de IA puede tardar.
    # Debe superar el timeout del backend (15 minutos).
    proxy_connect_timeout 10s;
    proxy_send_timeout 16m;
    proxy_read_timeout 16m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE must be streamed immediately instead of buffered by nginx.
    proxy_buffering off;
    proxy_cache off;
  }

  # SPA: todo lo demás al index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
